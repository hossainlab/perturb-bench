[project]
name = "perturb-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.12.19",
    "h5py>=3.16.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scanpy>=1.11.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "transformers>=4.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
